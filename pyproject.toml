[project]
name = "artemis"
version = "0.1.0"
description = "Artemis — multi-model CTF solver swarm"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai",
    "pydantic-settings",
    "aiodocker",
    "cursor-sdk>=0.1.9",
    "httpx",
    "rich",
    "click",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk"]
gemini = ["google-genai"]
all = ["claude-agent-sdk", "google-genai"]

[project.scripts]
artemis = "backend.cli:main"
artemis-daemon = "backend.daemon.server:main"
ctf-solve = "backend.cli:race_main"
ctf-msg = "backend.cli:msg"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
    "ty>=0.0.2",
    "claude-agent-sdk",
    "google-genai",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["**/._*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]
ignore = ["E501", "SIM105", "SIM115", "PTH123"]

[tool.ruff.lint.per-file-ignores]
# GF(2^128) math keeps uppercase field names (H, V, Z, …).
"sandbox/scripts/gf128_roots.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.environment]
python-version = "3.14"
